name: Snyk Auto-Remediation (Reusable)

on:
  workflow_call:
    inputs:
      target-repository:
        description: 'GitHub repository to scan in owner/repo form (defaults to the caller repository)'
        type: string
        default: ''
      target-branches:
        description: 'Comma-separated target branches to remediate'
        type: string
        default: 'master'
      engine-ref:
        description: 'Branch, tag, or SHA of uppnrise/snyk-auto-remediate containing the engine'
        type: string
        default: 'master'
      report-id:
        description: 'Unique report identifier when invoking the reusable workflow more than once'
        type: string
        default: 'scan'
      severity-threshold:
        description: 'Minimum severity to remediate (critical|high|medium|low)'
        type: string
        default: 'high'
      package-managers:
        description: 'Comma-separated package managers (leave empty for auto-detect)'
        type: string
        default: ''
      dry-run:
        description: 'Dry run — no changes committed or PRs opened'
        type: boolean
        default: false
      max-issues-per-run:
        description: 'Maximum number of GitHub Issues to create per run'
        type: number
        default: 10
      pr-labels:
        description: 'Comma-separated labels to apply to PRs'
        type: string
        default: 'security,dependencies,snyk,automated'
      issue-labels:
        description: 'Comma-separated labels to apply to Issues'
        type: string
        default: 'security,snyk,ai-remediation'
      pr-reviewers:
        description: 'Comma-separated GitHub usernames to request as PR reviewers'
        type: string
        default: ''
      pr-team-reviewers:
        description: 'Comma-separated GitHub team slugs to request as PR reviewers'
        type: string
        default: ''
      snyk-org-id:
        description: 'Snyk organization ID (overrides SNYK_ORG_ID secret)'
        type: string
        default: ''
      snyk-project-ids:
        description: 'Comma-separated Snyk project IDs to scope remediation'
        type: string
        default: ''
      working-directory:
        description: 'Working directory relative to repository root'
        type: string
        default: '.'
      node-version:
        description: 'Node.js version for the remediation engine'
        type: string
        default: '20'
      python-version:
        description: 'Python version to install (for Python projects)'
        type: string
        default: '3.12'
      java-version:
        description: 'Java version to install (for Java projects)'
        type: string
        default: '21'
      go-version:
        description: 'Go version to install (for Go projects)'
        type: string
        default: '1.22'
      run-tests:
        description: 'Run tests after applying fixes'
        type: boolean
        default: true
      test-command:
        description: 'Custom test command (overrides auto-detection)'
        type: string
        default: ''
      fail-on-no-fix:
        description: 'Exit with code 2 if no fixes were applied'
        type: boolean
        default: false
      enable-copilot-agent-fallback:
        description: 'Create GitHub Issues for unfixable findings, assigned to @copilot'
        type: boolean
        default: true
      copilot-assignee:
        description: 'GitHub username to assign unfixable finding issues to'
        type: string
        default: 'copilot'
    secrets:
      SNYK_TOKEN:
        required: true
      GH_PAT:
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: write

jobs:
  prepare:
    name: Prepare target branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.branches.outputs.json }}
      target-path: ${{ steps.paths.outputs.target_path }}
    steps:
      - name: Validate repository inputs
        id: paths
        env:
          TARGET_REPOSITORY: ${{ inputs['target-repository'] || github.repository }}
          TARGET_WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          ENGINE_REF: ${{ inputs['engine-ref'] }}
          REPORT_ID: ${{ inputs['report-id'] }}
        run: |
          if ! [[ "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::target-repository must use owner/repo syntax"
            exit 1
          fi
          if [[ "$TARGET_WORKING_DIRECTORY" = /* ]] || [[ "/$TARGET_WORKING_DIRECTORY/" = *"/../"* ]]; then
            echo "::error::working-directory must stay inside the target repository"
            exit 1
          fi
          if [ -z "$ENGINE_REF" ]; then
            echo "::error::engine-ref must name a branch, tag, or commit SHA"
            exit 1
          fi
          if ! [[ "$REPORT_ID" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::report-id may contain only letters, numbers, dots, underscores, and hyphens"
            exit 1
          fi
          working_directory="${TARGET_WORKING_DIRECTORY#./}"
          working_directory="${working_directory%/}"
          if [ -z "$working_directory" ] || [ "$working_directory" = "." ]; then
            echo "target_path=target" >> "$GITHUB_OUTPUT"
          else
            echo "target_path=target/$working_directory" >> "$GITHUB_OUTPUT"
          fi

      - name: Build branch matrix
        id: branches
        env:
          TARGET_BRANCHES: ${{ inputs['target-branches'] }}
        run: |
          branches="$(jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<< "$TARGET_BRANCHES")"
          if [ "$branches" = "[]" ]; then
            echo "::error::target-branches must contain at least one branch"
            exit 1
          fi
          echo "json=$branches" >> "$GITHUB_OUTPUT"

  remediate:
    name: Snyk Remediation (${{ matrix.branch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}
      fail-fast: false
    concurrency:
      group: snyk-remediation-${{ inputs['target-repository'] || github.repository }}-${{ matrix.branch }}-${{ inputs['report-id'] }}
      cancel-in-progress: false

    steps:
      - name: Checkout target ${{ inputs['target-repository'] || github.repository }}@${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs['target-repository'] || github.repository }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0
          path: target

      - name: Checkout remediation engine at ${{ inputs['engine-ref'] }}
        uses: actions/checkout@v4
        with:
          repository: uppnrise/snyk-auto-remediate
          ref: ${{ inputs['engine-ref'] }}
          path: .snyk-auto-remediate
          persist-credentials: false

      # ── Toolchain: Node.js (always needed for the engine) ──────────────────
      - name: Set up Node.js ${{ inputs['node-version'] }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs['node-version'] }}

      # ── Toolchain: Python (conditional) ────────────────────────────────────
      - name: Detect Python project
        id: detect-python
        working-directory: ${{ github.workspace }}/${{ needs.prepare.outputs.target-path }}
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "poetry.lock" ]; then
            echo "python_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python ${{ inputs['python-version'] }}
        if: steps.detect-python.outputs.python_needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs['python-version'] }}

      - name: Install Poetry 2.2.1
        if: steps.detect-python.outputs.python_needed == 'true' && hashFiles(format('{0}/poetry.lock', needs.prepare.outputs.target-path)) != ''
        working-directory: ${{ github.workspace }}/${{ needs.prepare.outputs.target-path }}
        run: python -m pip install --disable-pip-version-check poetry==2.2.1

      # ── Toolchain: Java (conditional) ──────────────────────────────────────
      - name: Detect Java project
        id: detect-java
        working-directory: ${{ github.workspace }}/${{ needs.prepare.outputs.target-path }}
        run: |
          if [ -f "pom.xml" ] || [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "java_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "java_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java ${{ inputs['java-version'] }}
        if: steps.detect-java.outputs.java_needed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs['java-version'] }}
          distribution: temurin

      # ── Toolchain: Go (conditional) ────────────────────────────────────────
      - name: Detect Go project
        id: detect-go
        working-directory: ${{ github.workspace }}/${{ needs.prepare.outputs.target-path }}
        run: |
          if [ -f "go.mod" ]; then
            echo "go_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go ${{ inputs['go-version'] }}
        if: steps.detect-go.outputs.go_needed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs['go-version'] }}

      # ── Snyk CLI ────────────────────────────────────────────────────────────
      - name: Install Snyk CLI
        run: npm install -g snyk@1.1306.1

      - name: Validate Snyk token and CLI
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is required; configure it as a repository or organization Actions secret"
            exit 1
          fi
          snyk --version

      # ── Remediation engine dependencies ────────────────────────────────────
      - name: Install remediation engine dependencies
        working-directory: ${{ github.workspace }}/.snyk-auto-remediate/scripts/remediate
        run: npm ci

      # ── Configure Git ───────────────────────────────────────────────────────
      - name: Configure Git
        run: |
          git config --global user.name "snyk-auto-remediate[bot]"
          git config --global user.email "snyk-auto-remediate@users.noreply.github.com"

      # ── Run remediation engine ──────────────────────────────────────────────
      - name: Run Snyk Auto-Remediation Engine
        id: remediate
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ inputs['snyk-org-id'] || vars.SNYK_ORG_ID || '' }}
          SNYK_PROJECT_IDS: ${{ inputs['snyk-project-ids'] }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ inputs['target-repository'] || github.repository }}
          SEVERITY_THRESHOLD: ${{ inputs['severity-threshold'] }}
          PACKAGE_MANAGERS: ${{ inputs['package-managers'] }}
          DRY_RUN: ${{ inputs['dry-run'] }}
          MAX_ISSUES_PER_RUN: ${{ inputs['max-issues-per-run'] }}
          PR_LABELS: ${{ inputs['pr-labels'] }}
          ISSUE_LABELS: ${{ inputs['issue-labels'] }}
          PR_REVIEWERS: ${{ inputs['pr-reviewers'] }}
          PR_TEAM_REVIEWERS: ${{ inputs['pr-team-reviewers'] }}
          WORKING_DIRECTORY: ${{ github.workspace }}/${{ needs.prepare.outputs.target-path }}
          ENABLE_COPILOT_AGENT_FALLBACK: ${{ inputs['enable-copilot-agent-fallback'] }}
          COPILOT_ASSIGNEE: ${{ inputs['copilot-assignee'] }}
          FAIL_ON_NO_FIX: ${{ inputs['fail-on-no-fix'] }}
          RUN_TESTS: ${{ inputs['run-tests'] }}
          TEST_COMMAND: ${{ inputs['test-command'] }}
          TARGET_BRANCH: ${{ matrix.branch }}
          REMEDIATION_BRANCH_SUFFIX: ${{ inputs['report-id'] }}
        run: ${{ github.workspace }}/.snyk-auto-remediate/scripts/remediate/node_modules/.bin/tsx ${{ github.workspace }}/.snyk-auto-remediate/scripts/remediate/src/index.ts

      # ── Upload SARIF to GitHub Security ────────────────────────────────────
      - name: Upload SARIF report
        if: always() && hashFiles(format('{0}/snyk-remediation-report.sarif', needs.prepare.outputs.target-path)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ github.workspace }}/${{ needs.prepare.outputs.target-path }}/snyk-remediation-report.sarif
          category: snyk-auto-remediation-${{ inputs['report-id'] }}

      # ── Upload JSON + SARIF artifacts ──────────────────────────────────────
      - name: Upload remediation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-remediation-${{ inputs['report-id'] }}-${{ strategy.job-index }}-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/${{ needs.prepare.outputs.target-path }}/snyk-remediation-report.json
            ${{ github.workspace }}/${{ needs.prepare.outputs.target-path }}/snyk-remediation-report.sarif
          if-no-files-found: ignore
          retention-days: 30
