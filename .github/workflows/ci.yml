name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  test:
    name: Test remediation engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/remediate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/remediate/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-coverage
          path: scripts/remediate/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npm run build

  snyk-cli-smoke-test:
    name: Snyk CLI install smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Snyk CLI (stable channel)
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: 'stable'

      - name: Verify Snyk CLI installed
        run: snyk --version
